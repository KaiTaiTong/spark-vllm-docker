name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual triggering from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to your fork
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          set -uo pipefail

          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          UPSTREAM_URL="https://github.com/eugr/spark-vllm-docker.git"

          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main
          git checkout main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Nothing to sync — upstream/main is already merged."
            exit 0
          fi

          # Merge exits non-zero on conflicts; keep going so we can auto-resolve workflows.
          git merge upstream/main --no-edit --no-commit --no-ff || true

          # Always keep our own workflow files.
          git checkout HEAD -- .github/workflows/
          git clean -fd .github/workflows/

          UNRESOLVED=$(git diff --name-only --diff-filter=U)
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::Conflicts outside .github/workflows/ need manual resolution:"
            echo "$UNRESOLVED"
            exit 1
          fi

          git commit -m "Sync upstream/main"

          git push origin main